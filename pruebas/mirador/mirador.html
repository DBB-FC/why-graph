<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mirador — el plugin dibujando un vault de demo</title>
<style>
  html, body { margin: 0; padding: 0; background: #060A18; }
  /* La vista del plugin vive dentro de un .view-content de Obsidian. */
  #hoja { width: 1440px; height: 860px; position: relative; overflow: hidden; }
  .view-content { padding: 16px; }
  :root {
    --font-monospace: ui-monospace, SFMono-Regular, Menlo, monospace;
    --font-interface: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
</style>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="hoja" class="view-content"></div>
<script>
  // Chrome sin interfaz no acepta una ventana de menos de 500 px: el tamaño del celular se
  // impone a la HOJA, que es lo que el plugin mide. La foto se recorta después.
  (function () {
    const q = new URLSearchParams(location.search);
    if (q.get('movil')) document.body.classList.add('is-phone');
    const ancho = q.get('ancho'), alto = q.get('alto');
    const hoja = document.getElementById('hoja');
    if (ancho) hoja.style.width = ancho + 'px';
    if (alto) hoja.style.height = alto + 'px';
  })();
</script>

<script>
// ── Lo que Obsidian agrega a HTMLElement, y el plugin usa ──────────────────────
const P = HTMLElement.prototype;
function crear(etiqueta, o) {
  const el = document.createElement(etiqueta);
  if (typeof o === 'string') el.className = o;
  else if (o) {
    if (o.cls) el.className = Array.isArray(o.cls) ? o.cls.join(' ') : o.cls;
    if (o.text) el.textContent = o.text;
    if (o.type) el.setAttribute('type', o.type);
    if (o.placeholder) el.setAttribute('placeholder', o.placeholder);
    if (o.href) el.setAttribute('href', o.href);
    if (o.attr) for (const [k, v] of Object.entries(o.attr)) el.setAttribute(k, v);
  }
  return el;
}
P.createEl = function (etiqueta, o) { const el = crear(etiqueta, o); this.appendChild(el); return el; };
P.createDiv = function (o) { return this.createEl('div', o); };
P.createSpan = function (o) { return this.createEl('span', o); };
P.setText = function (t) { this.textContent = t; return this; };
P.empty = function () { while (this.firstChild) this.removeChild(this.firstChild); return this; };
P.appendText = function (t) { this.appendChild(document.createTextNode(t)); return this; };
P.addClass = function (...c) { this.classList.add(...c); return this; };
P.removeClass = function (...c) { this.classList.remove(...c); return this; };
P.toggleClass = function (c, v) { this.classList.toggle(c, v); return this; };
P.hasClass = function (c) { return this.classList.contains(c); };
P.setCssProps = function (o) { for (const [k, v] of Object.entries(o)) this.style.setProperty(k, v); return this; };
// Copia fiel de enhance.js de Obsidian: show() NUNCA escribe «block», solo quita el «none».
// Un doble más generoso escondió en 1.27 una lista de resultados que en Obsidian no se veía.
P.show = function () { if (this.style.display === 'none') { this.style.display = this.getAttribute('data-display') || ''; this.removeAttribute('data-display'); } return this; };
P.hide = function () { const d = this.style.display; if (d !== 'none') { this.style.display = 'none'; if (d) this.setAttribute('data-display', d); else this.removeAttribute('data-display'); } return this; };
P.isShown = function () { return !!this.offsetParent; };
P.toggle = function (v) { return v ? this.show() : this.hide(); };

// ── El módulo «obsidian», lo mínimo para dibujar ───────────────────────────────
class Componente {
  registerEvent() {}
  registerDomEvent(el, tipo, fn, op) { el.addEventListener(tipo, fn, op); }
  registerInterval() {}
}
const obsidian = {
  Plugin: Componente,
  ItemView: class extends Componente { constructor(hoja) { super(); this.leaf = hoja; } },
  // No extiende Component en la API real: el doble tampoco debe hacerlo.
  PluginSettingTab: class { constructor(app, plugin) { this.app = app; this.plugin = plugin; } },
  Setting: class { constructor() {} setName() { return this; } setDesc() { return this; } setHeading() { return this; } addText(f) { f(campo()); return this; } addTextArea(f) { f(campo()); return this; } addToggle(f) { f(campo()); return this; } addSlider(f) { f(campo()); return this; } addDropdown(f) { f(campo()); return this; } addButton(f) { f(campo()); return this; } },
  Menu: class { addItem(f) { f(campo()); return this; } showAtMouseEvent() {} },
  Modal: class { constructor() { this.contentEl = document.createElement('div'); } setTitle() {} close() {} },
  Notice: class { constructor(m) { console.log('[aviso]', m); } },
  Platform: { isMobile: false, isPhone: false },
  debounce: (f) => f,
  // Sin la librería de íconos de Obsidian: solo la ✕ de cerrar se dibuja como texto, para que
  // las capturas del README no muestren un botón vacío.
  setIcon: (el, nombre) => { el.textContent = nombre === 'x' ? '✕' : ''; },
  requestUrl: async () => ({ status: 500, json: {} }),
  normalizePath: (p) => String(p).replace(/\/+/g, '/').replace(/^\/|\/$/g, ''),
  getLanguage: () => (new URLSearchParams(location.search).get('idioma') || 'es'),
};
const campo = () => { const o = {}; for (const k of ['setValue', 'onChange', 'setPlaceholder', 'setLimits', 'setDynamicTooltip', 'addOptions', 'setButtonText', 'setCta', 'onClick', 'setTitle', 'setIcon', 'setChecked', 'setDisabled', 'setTooltip']) o[k] = () => o; o.inputEl = { type: '', rows: 0, addClass() {} }; return o; };
window.require = (n) => { if (n === 'obsidian') return obsidian; throw new Error('sin ' + n); };
window.module = { exports: {} };
window.exports = window.module.exports;
</script>
<script src="setting-fiel.js"></script>
<script>obsidian.Setting = window.__SettingFiel;</script>
<script src="main.js"></script>
<script src="vault.js"></script>
<script>
// ── El vault falso, con la misma forma que la API que el plugin consulta ───────
(async () => {
  const { notas, ajustes } = window.__VAULT;
  const rutas = Object.keys(notas);
  const base = (p) => p.split('/').pop().replace(/\.md$/, '');
  const porBase = {}; rutas.forEach((p) => (porBase[base(p)] = p));
  const leerFm = (t) => {
    const o = {}; const m = t.match(/^---\n([\s\S]*?)\n---/); if (!m) return o;
    let clave = null;
    for (const l of m[1].split('\n')) {
      const lista = l.match(/^\s+-\s+(.*)$/);
      if (lista && clave) { (o[clave] = Array.isArray(o[clave]) ? o[clave] : []).push(lista[1].replace(/^["']|["']$/g, '')); continue; }
      const kv = l.match(/^([\w-]+):\s*(.*)$/); if (!kv) continue;
      clave = kv[1]; o[clave] = kv[2].replace(/^["']|["']$/g, '');
    }
    return o;
  };
  const archivo = (p) => ({ path: p, name: p.split('/').pop(), basename: base(p), extension: p.split('.').pop(), stat: { mtime: 0, ctime: 0, size: (notas[p] || '').length } });
  const resolved = {};
  for (const p of rutas) { resolved[p] = {}; for (const x of notas[p].matchAll(/\[\[([^\]|#]+)/g)) { const d = porBase[x[1].trim()]; if (d) resolved[p][d] = 1; } }
  const app = {
    vault: {
      // Como TFile: name y stat también, o el código que ordena por nombre revienta solo aquí.
      getMarkdownFiles: () => rutas.filter((p) => p.endsWith('.md')).map(archivo),
      getFiles: () => rutas.map(archivo),
      getFileByPath: (p) => (notas[p] !== undefined ? archivo(p) : null),
      getFolderByPath: () => null, createFolder: async () => {}, create: async () => {}, createBinary: async () => {},
      append: async () => {}, process: async () => {}, cachedRead: async (f) => notas[f.path], read: async (f) => notas[f.path],
    },
    fileManager: { processFrontMatter: async () => {} },
    metadataCache: { getFileCache: (f) => ({ frontmatter: leerFm(notas[f.path]) }), resolvedLinks: resolved, on: () => ({}) },
    workspace: { on: () => ({}), getLeavesOfType: () => [], getActiveFile: () => null, revealLeaf: () => {}, getLeaf: () => ({ setViewState: async () => {} }) },
    loadLocalStorage: () => null, saveLocalStorage: () => {},
  };
  const Plugin = window.module.exports.default || window.module.exports;
  const plugin = new Plugin();
  plugin.app = app;
  plugin.ajustes = Object.assign({}, window.__AJUSTES_BASE || {}, ajustes, { animacion: false, configurado: true });
  plugin.guardar = async () => {};
  plugin.refrescarVistas = () => {};
  plugin.tieneIA = () => false;
  plugin.manifest = { id: 'mapa-neuronal', version: '0.0.0-mirador' };

  // ?vista=ajustes → dibuja la pantalla de ajustes con Setting fiel, para comprobar que
  // no se rompe a mitad de camino. Una pantalla que lanza un error se corta en silencio.
  if (new URLSearchParams(location.search).get('vista') === 'ajustes') {
    const Tab = window.__AjustesMapa;
    const tab = new Tab(app, plugin);
    tab.containerEl = document.getElementById('hoja');
    let error = '';
    try { tab.display(); } catch (e) { error = e.message; }
    const pie = document.querySelector('.mn-pie'), logo = document.querySelector('.mn-marca-dbb');
    const pre = document.createElement('pre'); pre.id = 'diag';
    pre.textContent = JSON.stringify({
      error, ajustes: document.querySelectorAll('.setting-item').length,
      pie: pie ? pie.textContent : null,
      logo: !!logo && /data:image\/svg\+xml/.test(logo ? getComputedStyle(logo).backgroundImage : ''),
      probar: [...document.querySelectorAll('.setting-item-name')].map((x) => x.textContent).filter((x) => /probar|test/i.test(x)),
    }, null, 1);
    document.body.appendChild(pre);
    document.title = error ? 'ERROR: ' + error : 'listo';
    return;
  }
  const VistaMapa = window.__VistaMapa;
  const v = new VistaMapa({}, plugin);
  v.app = app;
  v.contentEl = document.getElementById('hoja');
  await v.onOpen();
  window.__v = v;
  // Un foco opcional por la URL: ?foco=nombre-de-nota
  const q = new URLSearchParams(location.search);
  const buscar = (t) => v.N.find((x) => x.titulo.toLowerCase().includes(String(t).toLowerCase()));
  const vista = q.get('vista') || '';
  if (vista === 'radial') {
    const n = buscar(q.get('foco') || '');
    v.radial = true; if (n) v.foco = n.id; v.medir(); v.pintarEstado();
  } else if (vista === 'vacios') {
    v.vacios = true; v.listaVacios = v.calcularVacios(); v.abrirPanel('vacios'); v.pintarEstado();
  } else if (vista === 'camino') {
    const a = buscar(q.get('de')), b = buscar(q.get('a'));
    const ruta = a && b ? v.rutaMasCorta(a.id, b.id) : null;
    if (ruta) { v.camino = ruta; v.panelCamino(ruta); v.pintarEstado(); }
    else document.title = 'ERROR: sin camino entre esas notas';
  } else if (vista === 'novedades') {
    // El panel de novedades con una revisión ya hecha (datos de la demo, sin IA): para ver el
    // diseño sin gastar llamadas. El chip de la barra se pinta igual que con material real.
    plugin.ingestaLista = () => true;
    plugin.ajustes.carpetaCrudo = 'Diario';
    const n = (texto, destino, extra) => Object.assign({ texto, destino, fuente: 'Diario/2026-09-15.md', seccion: '', verificada: true, estado: 'nuevo', crear: false }, extra);
    plugin.nov = { fase: 'revisar', aplicadas: 0, material: { piezas: [], sellos: {}, repetidos: 0 }, prop: { tandas: 2, leidas: 2, avisos: [], contradicciones: [], novedades: [
      n('Acordamos 12 kg de Huila lavado al mes desde octubre.', 'Clientes/hotel-andino.md', { seccion: 'Pedidos' }),
      n('Quieren sumar una cata para el equipo de cocina.', 'Clientes/hotel-andino.md'),
      n('Precio del kilo: $18.500', 'Clientes/hotel-andino.md', { estado: 'choca', detalle: 'La página dice $17.900 (agosto)' }),
      n('La tostadora nueva llega el 28 de octubre; instalación un día después.', 'Proyectos/proyecto-tostadora-nueva.md', { seccion: 'Plazos' }),
      n('Pendiente: cotizar el seguro de la máquina.', 'Proyectos/proyecto-tostadora-nueva.md', { verificada: false }),
      n('Tomás lidera el piloto de despacho en bicicleta.', 'Proyectos/proyecto-despacho-bici.md', { crear: true }),
      n('Revisar si conviene cambiar el proveedor de bolsas.', ''),
      n('Camila sigue a cargo de la cata semanal.', 'Personas/camila-soto.md', { estado: 'ya_estaba' }),
      n('El espresso de la casa usa el perfil medio.', 'Referencias/perfil-tueste-espresso.md', { estado: 'ya_estaba' }),
    ] } };
    v.contarNovedades();
    await v.panelNovedades();
  } else if (vista === 'buscar') {
    // Escribe en el buscador como una persona y mide si la lista se VE (estilo calculado).
    const caja = document.querySelector('.mn-buscar'), lista = document.querySelector('.mn-resultados');
    caja.value = q.get('q') || ''; caja.dispatchEvent(new Event('input'));
    await new Promise((r) => setTimeout(r, 0));   // el observador marca las filas en la vuelta siguiente
    caja.focus(); caja.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true }));
    const activo = document.activeElement;
    const pre = document.createElement('pre'); pre.id = 'diag';
    pre.textContent = JSON.stringify({ display: getComputedStyle(lista).display, alto: lista.getBoundingClientRect().height,
      filas: [...lista.querySelectorAll('.mn-resultado')].map((x) => x.textContent),
      teclado: { rol: activo?.getAttribute('role'), fila: !!activo?.classList.contains('mn-resultado') } });
    document.body.appendChild(pre);
  } else if (q.get('foco')) {
    const n = buscar(q.get('foco'));
    if (n) v.enfocar(n.id, true); else document.title = 'ERROR: no encuentro esa nota';
  }
  v.encuadrar(); v.dibujar();
  // segunda pasada: el panel cambia el ancho útil y el mapa se reencuadra
  await new Promise((r) => setTimeout(r, 120));
  v.medir(); v.encuadrar(); v.dibujar();
  // ?diag=1 → deja los números del encuadre en el DOM, para medir sin adivinar
  if (q.get('diag')) {
    const xs = v.N.filter((n2) => !n2.oculto).map((n2) => n2.x);
    const pre = document.createElement('pre'); pre.id = 'diag';
    pre.textContent = JSON.stringify({
      W: v.W, H: v.H, escala: +v.escala.toFixed(3), anchoLogico: v.anchoLogico, vista: v.vista,
      xReal: [Math.min(...xs) * v.vista.k + v.vista.x, Math.max(...xs) * v.vista.k + v.vista.x],
      barra: v.barra.getBoundingClientRect().width, angosto: v.contentEl.classList.contains('angosto'),
      buscador: document.querySelector('.mn-buscar').getBoundingClientRect().width,
      chipsFuera: [...document.querySelectorAll('.mn-chip')].filter((c) => c.getBoundingClientRect().right > v.W - 2).map((c) => c.textContent),
    }, null, 1);
    document.body.appendChild(pre);
  }
  document.title = 'listo';
})().catch((e) => { document.title = 'ERROR: ' + e.message; console.error(e); });
</script>
</body>
</html>
